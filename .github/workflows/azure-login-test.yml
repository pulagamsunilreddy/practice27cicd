name: Azure Login Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-login:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Sign in to Azure using OIDC
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify selected subscription
        run: |
          az account show \
            --query "{Subscription:name,SubscriptionId:id}" \
            --output table